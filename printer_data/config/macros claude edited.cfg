# ====================================================================
# RAMPING SLOWDOWN BY Z HEIGHT
# ====================================================================
# Gradually tapers print speed down between two heights instead of
# stepping all at once - smoother for tall/thin prints that wobble
# more the higher they get.
#
#   Z <= HEIGHT_START            -> 100% speed
#   HEIGHT_START..HEIGHT_END     -> linearly interpolated
#   Z >= HEIGHT_END              -> END_PERCENT speed (held for the rest)
#
# Setup required in your slicer (PrusaSlicer / OrcaSlicer / SuperSlicer):
#   Printer Settings -> Custom G-code -> "After layer change G-code":
#     LAYER_CHANGE Z={layer_z}
#
# Usage during/before a print:
#   SET_SLOWDOWN_RAMP HEIGHT_START=30 HEIGHT_END=100 END_PERCENT=50
#     -> stays at 100% until Z=30mm, tapers down to 50% by Z=100mm
#   For an old-style hard cutoff instead of a ramp, just set
#   HEIGHT_START and HEIGHT_END to the same value.
#   DISABLE_SLOWDOWN   ; turn it off, back to 100%

[gcode_macro _SLOWDOWN_VARS]
variable_start_height: 0
variable_end_height: 0
variable_end_percent: 100
variable_enabled: 0
gcode:
    # storage only - holds settings for SET_SLOWDOWN_RAMP / LAYER_CHANGE, never call directly

[gcode_macro SET_SLOWDOWN_RAMP]
description: Arm a gradual speed ramp between two Z heights. Usage: SET_SLOWDOWN_RAMP HEIGHT_START=30 HEIGHT_END=100 END_PERCENT=50
gcode:
    {% set HEIGHT_START = params.HEIGHT_START|default(0)|float %}
    {% set HEIGHT_END = params.HEIGHT_END|default(HEIGHT_START)|float %}
    {% set END_PERCENT = params.END_PERCENT|default(100)|float %}
    SET_GCODE_VARIABLE MACRO=_SLOWDOWN_VARS VARIABLE=start_height VALUE={HEIGHT_START}
    SET_GCODE_VARIABLE MACRO=_SLOWDOWN_VARS VARIABLE=end_height VALUE={[HEIGHT_END, HEIGHT_START]|max}
    SET_GCODE_VARIABLE MACRO=_SLOWDOWN_VARS VARIABLE=end_percent VALUE={END_PERCENT}
    SET_GCODE_VARIABLE MACRO=_SLOWDOWN_VARS VARIABLE=enabled VALUE=1
    RESPOND MSG="Slowdown ramp armed: 100% at Z={HEIGHT_START}mm tapering to {END_PERCENT}% by Z={HEIGHT_END}mm"

[gcode_macro DISABLE_SLOWDOWN]
description: Turn off the Z-height slowdown ramp and restore full speed
gcode:
    SET_GCODE_VARIABLE MACRO=_SLOWDOWN_VARS VARIABLE=enabled VALUE=0
    M220 S100
    RESPOND MSG="Slowdown disabled, speed restored to 100%"

[gcode_macro LAYER_CHANGE]
description: Called from the slicer's per-layer G-code as LAYER_CHANGE Z={layer_z}
gcode:
    {% set Z = params.Z|default(printer.toolhead.position.z)|float %}
    {% set vars = printer["gcode_macro _SLOWDOWN_VARS"] %}
    {% if vars.enabled %}
        {% if Z <= vars.start_height %}
            {% set percent = 100 %}
        {% elif Z >= vars.end_height %}
            {% set percent = vars.end_percent %}
        {% elif vars.end_height > vars.start_height %}
            {% set frac = (Z - vars.start_height) / (vars.end_height - vars.start_height) %}
            {% set percent = 100 - ((100 - vars.end_percent) * frac) %}
        {% else %}
            {% set percent = vars.end_percent %}
        {% endif %}
        M220 S{percent|round(0)|int}
    {% endif %}


# ====================================================================
# PRINT LIFECYCLE MACROS
# ====================================================================

[gcode_macro START_PRINT]
gcode:
    # Cancel any pending auto-shutdown left over from a previous job
    UPDATE_DELAYED_GCODE ID=delayed_printer_off DURATION=0

    # Reset any slowdown left armed from a previous print
    DISABLE_SLOWDOWN

    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    # NOTE: SKEW_PROFILE is disabled below because there is no
    # [skew_correction] section configured in printer.cfg. Calling it
    # as-is would abort every print with an "unknown command" error.
    # If you want skew correction, add a [skew_correction] section and
    # a saved profile named my_skew_profile, then re-enable this line.
    # SKEW_PROFILE LOAD=my_skew_profile

    # Pre-heat bed and ramp up hotend
    M117 Heating bed to {BED_TEMP}C...
    M140 S{BED_TEMP}
    M104 S150            ; pre-heat hotend partway to save oozing filament
    M190 S{BED_TEMP}

    # Homing and Adaptive Leveling
    M117 Homing and Leveling...
    G28
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=2

    # Final Hotend Heating and Parking
    M117 Heating hotend to {EXTRUDER_TEMP}C...
    SMART_PARK
    M109 S{EXTRUDER_TEMP}

    # State Reset
    M83
    M220 S100
    M221 S100
    G92 E0
    M107

    # Adaptive Purge
    M117 Purging...
    LINE_PURGE
    G91
    G1 Z2 F3000
    G90
    G92 E0

    M117 Printing...


[gcode_macro END_PRINT]
gcode:
    {% set max_layer_z = params.MAX_LAYER_Z|default(0)|float %}
    {% set printable_height = params.PRINTABLE_HEIGHT|default(250)|float %}
    {% set z_offset = params.Z_OFFSET|default(0)|float %}
    {% set travel_speed = (params.TRAVEL_SPEED|default(120)|float) * 0.6 %}
    {% set bed_max_y = params.BED_MAX_Y|default(220)|float %}

    # 1. Safe Lift: move up 2mm immediately to avoid melting the print
    {% set safe_lift = [max_layer_z + 2.0, printable_height]|min %}
    G1 Z{z_offset + safe_lift} F600

    # 2. Present Bed: move X to the side, push Y forward to present the print
    G1 X5 Y{bed_max_y * 0.9} F{travel_speed * 60}

    # 3. Final Clear Lift: lift much higher out of the way, never move down
    {% set final_lift = [max_layer_z + 50.0, printable_height]|min %}
    {% if final_lift > safe_lift %}
        G1 Z{z_offset + final_lift} F600
    {% endif %}

    # Shutdown Sequence
    DISABLE_MOTORS
    M140 S0
    M104 S0
    M107
    UPDATE_DELAYED_GCODE ID=delayed_printer_off DURATION=60
    M117 Print Complete! Cooldown sequence initiated...


[gcode_macro CANCEL_PRINT]
description: Safely cancels the active print and resets printer state
rename_existing: BASE_CANCEL_PRINT
gcode:
    {% set x_park = 10.0 %}
    {% set y_park = 200.0 %}
    {% set z_lift = 10.0 %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}

    {% if act_z < (max_z - z_lift) %}
        {% set z_safe = z_lift %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}

    M104 S0
    M140 S0
    M106 S0

    {% if printer.toolhead.homed_axes == "xyz" %}
        G91
        G1 E-2.0 F2100
        G1 Z{z_safe} F900
        G90
        G1 X{x_park} Y{y_park} F6000
    {% else %}
        M117 Axis not homed, skipping lift...
    {% endif %}

    BED_MESH_CLEAR
    M220 S100
    M221 S100
    M83

    BASE_CANCEL_PRINT
    M117 Print Cancelled!


# ====================================================================
# PAUSE, RESUME & SLEEP CONTROL
# ====================================================================

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set x_park = 10.0 %}
    {% set y_park = 200.0 %}
    {% set z_lift = 10.0 %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}

    {% if act_z < (max_z - z_lift) %}
        {% set z_safe = z_lift %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}

    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-1.0 F2100
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000


[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    G91
    G1 E1.0 F2100
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=100
    BASE_RESUME


[gcode_macro PARK_AND_SLEEP]
gcode:
    {% if printer.pause_resume.is_paused %}
        M117 Already paused. Sleeping heaters...
    {% else %}
        M117 Pausing print for sleep...
        PAUSE
    {% endif %}

    M104 S0
    M140 S0
    M106 S0
    M117 Printer asleep. Keep power ON!


[gcode_macro WAKE_AND_RESUME]
gcode:
    {% set target_extruder = printer.pause_resume.target_extruder|default(200)|float %}
    {% set target_bed = printer.pause_resume.target_bed|default(60)|float %}

    {% if printer.pause_resume.is_paused %}
        M117 Heating up for resume...
        M140 S{target_bed}
        M104 S{target_extruder}
        M190 S{target_bed}
        M109 S{target_extruder}
        M117 Resuming print...
        RESUME
    {% else %}
        M117 No active paused print to resume!
    {% endif %}


# ====================================================================
# MAINTENANCE & UTILITY MACROS
# ====================================================================

[gcode_macro CLEAN_NOZZLE]
description: Wipes nozzle back and forth across a predefined area
gcode:
    {% set wipe_count = 8 %}
    SAVE_GCODE_STATE NAME=clean_nozzle_state
    G90
    G0 Z15 F300
    {% for wipe in range(wipe_count) %}
        {% for coordinate in [200, 240] %}
            G0 X{coordinate} Y{4 + 0.25 * wipe} Z9.7 F12000
        {% endfor %}
    {% endfor %}
    RESTORE_GCODE_STATE NAME=clean_nozzle_state


[gcode_macro HEAT_SOAK]
description: Preheats bed for a heat soak (and hotend to standby). Usage: HEAT_SOAK TEMP=55
gcode:
    {% set TEMP = params.TEMP|default(55)|float %}
    {% set STANDBY = params.STANDBY|default(140)|float %}
    M140 S{TEMP}
    M104 S{STANDBY}
    RESPOND MSG="Heat soaking bed at {TEMP}C, hotend standby at {STANDBY}C"


[gcode_macro DISABLE_MOTORS]
description: Safely disables all stepper motors
gcode:
    M84 X Y Z E
    M117 Motors Disabled...


[gcode_macro FORCE_RAISE_Z]
description: Force-moves the Z stepper up 20mm
gcode:
    M400
    FORCE_MOVE STEPPER=stepper_z DISTANCE=20 VELOCITY=5


# ====================================================================
# FILAMENT UTILITIES
# ====================================================================

[gcode_macro LOAD_FILAMENT]
gcode:
    {% set TEMP = params.TEMP|default(240)|int %}
    M109 S{TEMP}
    G91
    G1 E30 F2000
    G1 E30 F200
    G90


[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set TEMP = params.TEMP|default(240)|int %}
    M109 S{TEMP}
    G91
    G1 E5 F300
    G1 E-120 F4000
    G90
    M104 S0


[gcode_macro DRY_FILAMENT]
description: Dries filament on the heated bed. Usage: DRY_FILAMENT TEMP=65 HOURS=4
gcode:
    {% set TARGET = params.TEMP|default(65)|int %}
    {% set HOURS = params.HOURS|default(4)|float %}
    {% set TOTAL_MINUTES = (HOURS * 60)|int %}

    # Cancel any pending auto-shutdown left over from a previous job
    UPDATE_DELAYED_GCODE ID=delayed_printer_off DURATION=0

    M104 S0   ; keep the hotend off, we only need the bed

    {% set current_bed = printer.heater_bed.temperature|float %}

    {% if TARGET > 85 and current_bed < TARGET %}
        # High target temps get ramped up in 5C steps, 5 minutes per
        # step, so the bed doesn't overshoot while it heat-soaks.
        RESPOND MSG="Target is above 85C - ramping up gradually..."
        {% set start_temp = [current_bed, 85]|max|int %}
        {% for t in range(start_temp, TARGET + 1, 5) %}
            M140 S{t}
            RESPOND MSG="Ramping bed to {t}C..."
            G4 P300000               ; hold 5 minutes at this step
            SET_IDLE_TIMEOUT TIMEOUT=1800
        {% endfor %}
    {% else %}
        M140 S{TARGET}
        RESPOND MSG="Heating bed to {TARGET}C..."
    {% endif %}

    # Wait for final target to actually be reached
    M190 S{TARGET}
    RESPOND MSG="Target reached. Drying for {HOURS} hour(s)..."

    # Hold at temperature, 1 minute per loop, resetting idle timeout
    # each time so Klipper doesn't shut the heaters off on its own.
    {% for i in range(TOTAL_MINUTES) %}
        G4 P60000                    ; hold 1 minute
        SET_IDLE_TIMEOUT TIMEOUT=1800
    {% endfor %}

    M140 S0
    RESPOND MSG="Drying complete. Powering down printer..."
    UPDATE_DELAYED_GCODE ID=delayed_printer_off DURATION=1


# ====================================================================
# BLTOUCH TESTING & OVERRIDES
# ====================================================================

[gcode_macro BLTOUCH_RESET]
gcode:
    BLTOUCH_DEBUG COMMAND=reset

[gcode_macro BLTOUCH_PIN_UP]
gcode:
    BLTOUCH_DEBUG COMMAND=pin_up

[gcode_macro BLTOUCH_PIN_DOWN]
gcode:
    BLTOUCH_DEBUG COMMAND=pin_down

[gcode_macro BLTOUCH_TEST]
gcode:
    BLTOUCH_DEBUG COMMAND=touch_mode
    QUERY_PROBE


# ====================================================================
# QUALITY OF LIFE: PRESSURE ADVANCE ON THE FLY
# ====================================================================
# Wraps Klipper's built-in SET_PRESSURE_ADVANCE so you don't need to
# specify EXTRUDER= yourself. You can also just type the built-in
# commands directly into the Mainsail console any time, e.g.:
#   SET_PRESSURE_ADVANCE ADVANCE=0.04
#   SET_RETRACTION RETRACT_LENGTH=0.3 RETRACT_SPEED=40

[gcode_macro SET_PRESSURE_ADVANCE]
description: Set pressure advance, auto-filling EXTRUDER= for the active extruder
rename_existing: SET_PRESSURE_ADVANCE_BASE
gcode:
    {% if 'EXTRUDER' in params %}
        SET_PRESSURE_ADVANCE_BASE {rawparams}
    {% else %}
        {% set active_ext = printer.toolhead.extruder %}
        SET_PRESSURE_ADVANCE_BASE EXTRUDER={active_ext} {rawparams}
    {% endif %}


# ====================================================================
# GITHUB BACKUP SCRIPT
# ====================================================================

[gcode_shell_command backup_cfg]
command: bash /home/ben/klipper-backup/script.sh -c "Mainsail Dashboard Backup"
timeout: 60.0
verbose: True

[gcode_macro GITHUB_BACKUP]
gcode:
    RUN_SHELL_COMMAND CMD=backup_cfg


# ====================================================================
# PSU POWER CONTROL
# ====================================================================
# NOTE: device="printer" and device="printer_led" below must exactly
# match the [power printer] / [power printer_led] section names in
# your moonraker.conf. If auto shutdown silently does nothing, check
# that first - mismatched device names is the most common cause.

[gcode_macro POWER_OFF_PRINTER]
gcode:
    {action_call_remote_method("set_device_power",
                               device="printer_led",
                               state="off")}
    {action_call_remote_method("set_device_power",
                               device="printer",
                               state="off")}


[gcode_macro CANCEL_AUTO_SHUTDOWN]
description: Cancels a pending auto power-off countdown
gcode:
    UPDATE_DELAYED_GCODE ID=delayed_printer_off DURATION=0
    RESPOND MSG="Auto shutdown cancelled."


[delayed_gcode delayed_printer_off]
initial_duration: 0
gcode:
    {% set hot = printer.extruder %}
    {% set bed = printer.heater_bed %}
    {% if hot.temperature >= 50 or hot.target >= 50
          or bed.temperature >= 50 or bed.target >= 50
          or printer.idle_timeout.state == "Printing" %}
        RESPOND MSG="Still cooling / active - rechecking in 60s..."
        UPDATE_DELAYED_GCODE ID=delayed_printer_off DURATION=60
    {% else %}
        RESPOND MSG="All clear - powering off printer."
        POWER_OFF_PRINTER
    {% endif %}

#### END OF MACROS.CFG
