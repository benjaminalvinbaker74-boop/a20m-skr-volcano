[gcode_macro CHANGE_NOZZLE]
description: Interactive V6 nozzle swap assistant with cool finger-threading stage
gcode:
    {% set HOT_TEMP = params.TEMP|default(250)|float %}     # Heat break loosening / final tightening temp
    
    # 1. Home printer if required
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    
    # 2. Position toolhead for easy access (X100, Y0, Z125)
    RESPOND MSG="Positioning toolhead for nozzle change..."
    G90
    G1 Z125 F1500
    G1 X100 Y0 F6000
    
    # Keep stepper motors energized so the toolhead stays steady
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
    
    # 3. Initial Heat up to loosen old nozzle
    RESPOND MSG="Heating hotend to {HOT_TEMP}°C to break nozzle torque..."
    M109 S{HOT_TEMP}
    
    # 4. Pause 1: Break torque & turn off heater
    RESPOND MSG=">>> ACTION: Loosen nozzle slightly with spanner. Click RESUME when ready to cool down <<<"
    PAUSE
    
    # 5. Cool hotend down for safe removal / finger threading
    M104 S0
    RESPOND MSG="Cooling hotend to allow safe nozzle removal & finger-threading new nozzle..."
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=50
    
    # 6. Pause 2: Thread new nozzle finger-tight
    RESPOND MSG=">>> ACTION: Remove old nozzle, finger-tighten new nozzle cold (back off 1/4 turn). Click RESUME when ready to hot-tighten <<<"
    PAUSE
    
    # 7. Re-heat for final hot tightening
    RESPOND MSG="Re-heating to {HOT_TEMP}°C for final hot-torque..."
    M109 S{HOT_TEMP}
    
    # 8. Pause 3: Final torqueing
    RESPOND MSG=">>> ACTION: Apply final torque (approx 1.5 - 2.5 Nm) holding heater block. Click RESUME when finished <<<"
    PAUSE
    
    # 9. Cleanup & Cool down
    M104 S0
    M107
    RESPOND MSG="Nozzle change complete! Hotend turning off."




[gcode_macro PID_TUNE_HOTEND]
description: PID tune hotend at X40 Y40 Z10 with optional bed temp and fan speed
gcode:
    {% set TARGET = params.TARGET|default(280)|float %}
    {% set FAN_PERCENT = params.FAN|default(50)|int %}      # Default 50%
    {% set BED_TARGET = params.BED|default(60)|float %}      # Default 60°C bed
    
    # Calculate PWM fan speed (0-255)
    {% set FAN_SPEED = (FAN_PERCENT * 2.55)|int %}
    
    # 1. Home printer if not already homed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    
    # 2. Move to parking location over the bed
    RESPOND MSG="Parking toolhead at X40 Y40 Z10 for thermal testing..."
    G90
    G1 Z10 F1500
    G1 X40 Y40 F6000
    
    # 3. Heat bed if specified
    {% if BED_TARGET > 0 %}
        RESPOND MSG="Heating bed to {BED_TARGET}°C..."
        M190 S{BED_TARGET}
    {% endif %}
    
    # 4. Set part cooling fan
    {% if FAN_SPEED > 0 %}
        M106 S{FAN_SPEED}
        RESPOND MSG="Fan set to {FAN_PERCENT}% ({FAN_SPEED}/255)."
    {% else %}
        M107
    {% endif %}
    
    # 5. Execute PID tune
    RESPOND MSG="Starting PID calibration for hotend at {TARGET}°C..."
    PID_CALIBRATE HEATER=extruder TARGET={TARGET}
    
    # 6. Cleanup
    M107
    M140 S0
    
    SAVE_CONFIG







[gcode_macro PURGE_FILAMENT]
description: Purge filament slowly to clear nozzle during manual changes
gcode:
    {% set LENGTH = params.LENGTH|default(30)|float %}      # Default purge 30mm
    {% set SPEED = params.SPEED|default(120)|float %}       # Default speed 2mm/s (120mm/min)
    {% set MIN_TEMP = params.MIN_TEMP|default(180)|float %} # Min safe temp threshold
    
    {% if printer.extruder.can_extrude %}
        RESPOND MSG="Purging {LENGTH}mm of filament..."
        SAVE_GCODE_STATE NAME=purge_state
        M83                        # Relative extrusion mode
        G1 E{LENGTH} F{SPEED}      # Slow extrusion
        G1 E-2 F1800               # Small 2mm retraction to control ooze
        RESTORE_GCODE_STATE NAME=purge_state
    {% else %}
        RESPOND TYPE=error MSG="Hotend temperature too low! Heat to at least {MIN_TEMP}°C first."
    {% endif %}








# ====================================================================
# CHANGELOG (this "documented" copy only - the clean copy has no
# changelog, just the result)
# ====================================================================
# >>> REMOVED: [gcode_macro CANCEL_PRINT], [gcode_macro PAUSE],
#     [gcode_macro RESUME] - these were duplicates of the ones already
#     defined in mainsail.cfg. Because macros.cfg loaded after
#     mainsail.cfg, every PAUSE was actually running TWO retract+park
#     sequences back to back (mainsail's, then this file's on top of
#     it) via a chain of rename_existing renames (PAUSE_BASE / BASE_PAUSE).
#     Not fatal, but redundant retraction on every single pause/cancel.
# >>> ADDED: [gcode_macro M600] - a manual filament/colour change macro
#     that calls the existing PAUSE (now singular, in mainsail.cfg) and
#     adds the extra retraction needed to physically pull filament out.
#     See printer.cfg for the matching _CLIENT_VARIABLE config block
#     and the _USER_RESUME_EXTRAS / _USER_CANCEL_EXTRAS hook macros
#     that this now relies on.
# >>> UNCHANGED: PARK_AND_SLEEP / WAKE_AND_RESUME still call PAUSE/RESUME
#     by name - they now transparently use mainsail.cfg's versions
#     instead of the old duplicated ones. No edits needed there.
# >>> FIXED (found while reviewing, unrelated to the PAUSE cleanup):
#     START_PRINT was calling SKEW_PROFILE LOAD=my_skew_profile with no
#     [skew_correction] section anywhere in printer.cfg. That command
#     doesn't exist without one, so this was very likely aborting every
#     print at the start with an "unknown command" klippy error. Commented
#     out with an explanation. Also added two small START_PRINT hygiene
#     lines (cancel pending auto-shutdown, reset the slowdown ramp) -
#     both pulled from an old unused "claude edited" draft that had
#     already caught and fixed this same bug previously, but was never
#     actually merged into the live macros.cfg.
# ====================================================================
# NOTE: [pause_resume] and [respond] are already declared in mainsail.cfg
# (included below) - they were previously ALSO declared here, which was
# a harmless but pointless duplicate. Removed.

# ====================================================================
# PAUSE / RESUME / CANCEL_PRINT CONFIGURATION
# ====================================================================
# This is the ONE place that configures the PAUSE/RESUME/CANCEL_PRINT
# macros defined in mainsail.cfg. Do not redefine PAUSE/RESUME/CANCEL_PRINT
# anywhere else - that's what caused the old double-retract/double-park
# behaviour. M600 (in macros.cfg) builds on top of this via plain PAUSE.
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True    ; park at a fixed spot instead of mainsail's default bed corner
variable_custom_park_x    : 10.0
variable_custom_park_y    : 200.0
variable_custom_park_dz   : 10.0    ; lift this far before parking (extra clearance for filament swaps)
variable_retract          : 1.0     ; small anti-ooze retract on every PAUSE
variable_cancel_retract   : 2.0     ; retract on CANCEL_PRINT
variable_speed_retract    : 35.0
variable_unretract        : 1.0     ; prime amount on a normal RESUME (not a filament-change RESUME - see M600)
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 100.0
variable_park_at_cancel   : True    ; also park on CANCEL_PRINT
variable_park_at_cancel_x : 10.0
variable_park_at_cancel_y : 200.0
variable_use_fw_retract   : False
variable_idle_timeout     : 1800    ; while paused, extend idle_timeout to 30 min so heaters/steppers don't shut off mid filament-swap
variable_runout_sensor    : ""      ; set to e.g. "filament_switch_sensor runout" if you add a runout sensor later
variable_user_pause_macro : ""
variable_user_resume_macro: "_USER_RESUME_EXTRAS"   ; finishes priming the extra filament M600 pulled out
variable_user_cancel_macro: "_USER_CANCEL_EXTRAS"   ; restores bed mesh / speed / flow after a cancelled print
gcode:
    # settings-only macro, never called directly

[gcode_macro _USER_RESUME_EXTRAS]
description: Runs just before RESUME finishes. Primes any filament M600 pulled out.
gcode:
    {% set pending = printer["gcode_macro M600"].pending_prime|default(0)|float %}
    {% if pending > 0 %}
        M83
        G1 E{pending} F300
        SET_GCODE_VARIABLE MACRO=M600 VARIABLE=pending_prime VALUE=0
        M117 Priming after colour change...
    {% endif %}

[gcode_macro _USER_CANCEL_EXTRAS]
description: Runs during CANCEL_PRINT. Restores speed/flow/extrusion mode and clears the bed mesh.
gcode:
    BED_MESH_CLEAR
    M220 S100
    M221 S100
    M83


# ====================================================================
# RAMPING SLOWDOWN BY Z HEIGHT
# ====================================================================
# Gradually tapers print speed down between two heights instead of
# stepping all at once - smoother for tall/thin prints that wobble
# more the higher they get.
#
#   Z <= HEIGHT_START            -> 100% speed
#   HEIGHT_START..HEIGHT_END     -> linearly interpolated
#   Z >= HEIGHT_END              -> END_PERCENT speed (held for the rest)
#
# Setup required in your slicer (PrusaSlicer / OrcaSlicer / SuperSlicer):
#   Printer Settings -> Custom G-code -> "After layer change G-code":
#     LAYER_CHANGE Z={layer_z}
#
# Usage during/before a print:
#   SET_SLOWDOWN_RAMP HEIGHT_START=30 HEIGHT_END=100 END_PERCENT=50
#     -> stays at 100% until Z=30mm, tapers down to 50% by Z=100mm
#   For an old-style hard cutoff instead of a ramp, just set
#   HEIGHT_START and HEIGHT_END to the same value.
#   DISABLE_SLOWDOWN   ; turn it off, back to 100%

[gcode_macro _SLOWDOWN_VARS]
variable_start_height: 0
variable_end_height: 0
variable_end_percent: 100
variable_enabled: 0
gcode:
    # storage only - holds settings for SET_SLOWDOWN_RAMP / LAYER_CHANGE, never call directly

[gcode_macro SET_SLOWDOWN_RAMP]
description: Arm a gradual speed ramp between two Z heights. Usage: SET_SLOWDOWN_RAMP HEIGHT_START=30 HEIGHT_END=100 END_PERCENT=50
gcode:
    {% set HEIGHT_START = params.HEIGHT_START|default(0)|float %}
    {% set HEIGHT_END = params.HEIGHT_END|default(HEIGHT_START)|float %}
    {% set END_PERCENT = params.END_PERCENT|default(100)|float %}
    SET_GCODE_VARIABLE MACRO=_SLOWDOWN_VARS VARIABLE=start_height VALUE={HEIGHT_START}
    SET_GCODE_VARIABLE MACRO=_SLOWDOWN_VARS VARIABLE=end_height VALUE={[HEIGHT_END, HEIGHT_START]|max}
    SET_GCODE_VARIABLE MACRO=_SLOWDOWN_VARS VARIABLE=end_percent VALUE={END_PERCENT}
    SET_GCODE_VARIABLE MACRO=_SLOWDOWN_VARS VARIABLE=enabled VALUE=1
    RESPOND MSG="Slowdown ramp armed: 100% at Z={HEIGHT_START}mm tapering to {END_PERCENT}% by Z={HEIGHT_END}mm"

[gcode_macro DISABLE_SLOWDOWN]
description: Turn off the Z-height slowdown ramp and restore full speed
gcode:
    SET_GCODE_VARIABLE MACRO=_SLOWDOWN_VARS VARIABLE=enabled VALUE=0
    M220 S100
    RESPOND MSG="Slowdown disabled, speed restored to 100%"

[gcode_macro LAYER_CHANGE]
description: Called from the slicer's per-layer G-code as LAYER_CHANGE Z={layer_z}
gcode:
    {% set Z = params.Z|default(printer.toolhead.position.z)|float %}
    {% set vars = printer["gcode_macro _SLOWDOWN_VARS"] %}
    {% if vars.enabled %}
        {% if Z <= vars.start_height %}
            {% set percent = 100 %}
        {% elif Z >= vars.end_height %}
            {% set percent = vars.end_percent %}
        {% elif vars.end_height > vars.start_height %}
            {% set frac = (Z - vars.start_height) / (vars.end_height - vars.start_height) %}
            {% set percent = 100 - ((100 - vars.end_percent) * frac) %}
        {% else %}
            {% set percent = vars.end_percent %}
        {% endif %}
        M220 S{percent|round(0)|int}
    {% endif %}




########
### Gemini cleansed & Saninitized ##

# ====================================================================
# PRINT LIFECYCLE MACROS
# ====================================================================

[gcode_macro START_PRINT]
gcode:
    # >>> ADDED: cancel any pending auto-shutdown left over from a previous job
    UPDATE_DELAYED_GCODE ID=delayed_printer_off DURATION=0

    # >>> ADDED: reset any slowdown ramp left armed from a previous print
    DISABLE_SLOWDOWN

    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    # >>> CHANGED: SKEW_PROFILE below is now commented out. There is no
    # [skew_correction] section configured in printer.cfg, so calling
    # this as-is would abort EVERY print with an "unknown command"
    # error the moment START_PRINT ran. This was live and almost
    # certainly already breaking prints before this cleanup. Add a
    # [skew_correction] section and a saved profile named
    # my_skew_profile, then re-enable the line below.
    # SKEW_PROFILE LOAD=my_skew_profile

    # Pre-heat bed and ramp up hotend
    M117 Heating bed to {BED_TEMP}C...
    M140 S{BED_TEMP}
    M104 S150           			#### pre heat hotend to save burning filament
   	# M104 S{EXTRUDER_TEMP}
    M190 S{BED_TEMP}

    # Homing and Adaptive Leveling
    M117 Homing and Leveling...
    G28
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=2

    # Final Hotend Heating and Parking
    M117 Heating hotend to {EXTRUDER_TEMP}C...
    SMART_PARK
    M109 S{EXTRUDER_TEMP}
    
    # State Reset
    M83
    M220 S100
    M221 S100
    G92 E0
    M107
    
    # Adaptive Purge
    M117 Purging...
    LINE_PURGE
    G91
    G1 Z2 F3000
    G90
    G92 E0

    M117 Printing...

[gcode_macro END_PRINT]
gcode:
    {% set max_layer_z = params.MAX_LAYER_Z|default(0)|float %}
    {% set printable_height = params.PRINTABLE_HEIGHT|default(250)|float %}
    {% set z_offset = params.Z_OFFSET|default(0)|float %}
    {% set travel_speed = (params.TRAVEL_SPEED|default(120)|float) * 0.6 %}
    {% set bed_max_y = params.BED_MAX_Y|default(220)|float %}
    
    # 1. Safe Lift
    {% set safe_lift = [max_layer_z + 2.0, printable_height]|min %}
    G1 Z{z_offset + safe_lift} F600

    # 2. Present Bed
    G1 X5 Y{bed_max_y * 0.9} F{travel_speed * 60}

    # 3. Final Clear Lift
    {% set final_lift = [max_layer_z + 50.0, printable_height]|min %}
    {% if final_lift > safe_lift %}
        G1 Z{z_offset + final_lift} F600
    {% endif %}

    # 4. Tip Shape & Unload while hotend is at print temp
    UNLOAD_FILAMENT

    # Shutdown Sequence
    DISABLE_MOTORS
    M140 S0
    M104 S0
    M107
    UPDATE_DELAYED_GCODE ID=delayed_printer_off DURATION=60
    M117 Print Complete! Filament safely unloaded.

