### Gemini cleansed & Saninitized ##

# ====================================================================
# PRINT LIFECYCLE MACROS
# ====================================================================

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    SKEW_PROFILE LOAD=my_skew_profile
    
    # Pre-heat bed and ramp up hotend
    M117 Heating bed to {BED_TEMP}C...
    M140 S{BED_TEMP}
    M104 S150           			#### pre heat hotend to save burning filament
   	# M104 S{EXTRUDER_TEMP}
    M190 S{BED_TEMP}

    # Homing and Adaptive Leveling
    M117 Homing and Leveling...
    G28
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=2

    # Final Hotend Heating and Parking
    M117 Heating hotend to {EXTRUDER_TEMP}C...
    SMART_PARK
    M109 S{EXTRUDER_TEMP}
    
    # State Reset
    M83
    M220 S100
    M221 S100
    G92 E0
    M107
    
    # Adaptive Purge
    M117 Purging...
    LINE_PURGE
    G91
    G1 Z2 F3000
    G90
    G92 E0

    M117 Printing...


[gcode_macro END_PRINT]
gcode:
    {% set max_layer_z = params.MAX_LAYER_Z|default(0)|float %}
    {% set printable_height = params.PRINTABLE_HEIGHT|default(250)|float %}
    {% set z_offset = params.Z_OFFSET|default(0)|float %}
    {% set travel_speed = (params.TRAVEL_SPEED|default(120)|float) * 0.6 %}
    {% set bed_max_y = params.BED_MAX_Y|default(220)|float %}
    
    # 1. Safe Lift: Move 2mm up immediately to avoid melting the print
    {% set safe_lift = [max_layer_z + 2.0, printable_height]|min %}
    G1 Z{z_offset + safe_lift} F600

    # 2. Present Bed: Move X to side, push Y forward to present the print
    # 	 bed presents by moving Y toward the front (max Y)
    G1 X5 Y{bed_max_y * 0.9} F{travel_speed * 60}

    # 3. Final Clear Lift: Lift much higher out of the way, but NEVER move down
    {% set final_lift = [max_layer_z + 50.0, printable_height]|min %}
    # Only execute if the final lift is actually higher than where we currently are
    {% if final_lift > safe_lift %}
        G1 Z{z_offset + final_lift} F600
    {% endif %}

    # Shutdown Sequence
    DISABLE_MOTORS
    M140 S0
    M104 S0
    M107
    UPDATE_DELAYED_GCODE ID=delayed_printer_off DURATION=60
    M117 Print Complete! Cooldown sequence initiated...


 

[gcode_macro CANCEL_PRINT]
description: Safely cancels the active print and resets printer state
rename_existing: BASE_CANCEL_PRINT
gcode:
    {% set x_park = 10.0 %}                  ; Safe left-side parking position
    {% set y_park = 200.0 %}                 ; Safe rear parking position
    {% set z_lift = 10.0 %}                  ; Amount to lift Z axis
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    
    # Calculate safe Z lift clearance
    {% if act_z < (max_z - z_lift) %}
        {% set z_safe = z_lift %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}

    # Turn off heaters & fans
    M104 S0
    M140 S0
    M106 S0

    # Retract and Lift
    {% if printer.toolhead.homed_axes == "xyz" %}
        G91
        G1 E-2.0 F2100                       ; Retract 2mm to prevent ooze
        G1 Z{z_safe} F900                    ; Lift nozzle
        G90
        G1 X{x_park} Y{y_park} F6000         ; Move to safe corner
    {% else %}
        M117 Axis not homed, skipping lift...
    {% endif %}

    # Clear mesh & state resets
    BED_MESH_CLEAR
    M220 S100
    M221 S100
    M83
    
    BASE_CANCEL_PRINT
    M117 Print Cancelled!


# ====================================================================
# PAUSE, RESUME & SLEEP CONTROL
# ====================================================================

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set x_park = 10.0 %}
    {% set y_park = 200.0 %}
    {% set z_lift = 10.0 %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    
    {% if act_z < (max_z - z_lift) %}
        {% set z_safe = z_lift %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-1.0 F2100
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000


[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    G91
    G1 E1.0 F2100
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=100
    BASE_RESUME


[gcode_macro PARK_AND_SLEEP]
gcode:
    {% if printer.pause_resume.is_paused %}
        M117 Already paused. Sleeping heaters...
    {% else %}
        M117 Pausing print for sleep...
        PAUSE
    {% endif %}
    
    M104 S0
    M140 S0
    M106 S0
    M117 Printer asleep. Keep power ON!


[gcode_macro WAKE_AND_RESUME]
gcode:
    {% set target_extruder = printer.pause_resume.target_extruder|default(200)|float %}
    {% set target_bed = printer.pause_resume.target_bed|default(60)|float %}
    
    {% if printer.pause_resume.is_paused %}
        M117 Heating up for resume...
        M140 S{target_bed}
        M104 S{target_extruder}
        M190 S{target_bed}
        M109 S{target_extruder}
        M117 Resuming print...
        RESUME
    {% else %}
        M117 No active paused print to resume!
    {% endif %}


# ====================================================================
# MAINTENANCE & UTILITY MACROS
# ====================================================================

[gcode_macro CLEAN_NOZZLE]
description: Wipes nozzle back and forth across a predefined area
gcode:
    {% set wipe_count = 8 %}
    SAVE_GCODE_STATE NAME=clean_nozzle_state
    G90
    G0 Z15 F300
    {% for wipe in range(wipe_count) %}
        {% for coordinate in [200, 240] %}
            G0 X{coordinate} Y{4 + 0.25 * wipe} Z9.7 F12000
        {% endfor %}
    {% endfor %}
    RESTORE_GCODE_STATE NAME=clean_nozzle_state


[gcode_macro HEAT_BED_55]
description: Preheats bed to 55C and hotend to standby 140C
gcode:
    M140 S55
    M104 S140


[gcode_macro DISABLE_MOTORS]
description: Safely disables all stepper motors
gcode:
    M84 X Y Z E
    M117 Motors Disabled...


[gcode_macro FORCE_RAISE_Z]
description: Force-moves the Z stepper up 20mm
gcode:
    M400
    FORCE_MOVE STEPPER=stepper_z DISTANCE=20 VELOCITY=5


# ====================================================================
# FILAMENT UTILITIES
# ====================================================================
 
[gcode_macro LOAD_FILAMENT]
gcode:
    {% set TEMP = params.TEMP|default(240)|int %}
    M109 S{TEMP}
    G91
    G1 E30 F2000
    G1 E30 F200
    G90
 
 
[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set TEMP = params.TEMP|default(240)|int %}
    M109 S{TEMP}
    G91
    G1 E5 F300
    G1 E-120 F4000
    G90
    M104 S0
 
 
[gcode_macro DRY_FILAMENT]
description: Dries filament on the heated bed. Usage: DRY_FILAMENT TEMP=65 HOURS=4
gcode:
    {% set TARGET = params.TEMP|default(65)|int %}
    {% set HOURS = params.HOURS|default(4)|float %}
    {% set TOTAL_MINUTES = (HOURS * 60)|int %}
 
    # Cancel any pending auto-shutdown left over from a previous job
    UPDATE_DELAYED_GCODE ID=delayed_printer_off DURATION=0
 
    M104 S0   ; keep the hotend off, we only need the bed
 
    {% set current_bed = printer.heater_bed.temperature|float %}
 
    {% if TARGET > 85 and current_bed < TARGET %}
        # High target temps get ramped up in 5C steps, 5 minutes per
        # step, so the bed doesn't overshoot while it heat-soaks.
        RESPOND MSG="Target is above 85C - ramping up gradually..."
        {% set start_temp = [current_bed, 85]|max|int %}
        {% for t in range(start_temp, TARGET + 1, 5) %}
            M140 S{t}
            RESPOND MSG="Ramping bed to {t}C..."
            G4 P300000               ; hold 5 minutes at this step
            SET_IDLE_TIMEOUT TIMEOUT=1800
        {% endfor %}
    {% else %}
        M140 S{TARGET}
        RESPOND MSG="Heating bed to {TARGET}C..."
    {% endif %}
 
    # Wait for final target to actually be reached
    M190 S{TARGET}
    RESPOND MSG="Target reached. Drying for {HOURS} hour(s)..."
 
    # Hold at temperature, 1 minute per loop, resetting idle timeout
    # each time so Klipper doesn't shut the heaters off on its own.
    {% for i in range(TOTAL_MINUTES) %}
        G4 P60000                    ; hold 1 minute
        SET_IDLE_TIMEOUT TIMEOUT=1800
    {% endfor %}
 
    M140 S0
    RESPOND MSG="Drying complete. Powering down printer..."
    UPDATE_DELAYED_GCODE ID=delayed_printer_off DURATION=1
 


# ====================================================================
# BLTOUCH TESTING & OVERRIDES
# ====================================================================

[gcode_macro BLTOUCH_RESET]
gcode:
    BLTOUCH_DEBUG COMMAND=reset


[gcode_macro BLTOUCH_PIN_UP]
gcode:
    BLTOUCH_DEBUG COMMAND=pin_up


[gcode_macro BLTOUCH_PIN_DOWN]
gcode:
    BLTOUCH_DEBUG COMMAND=pin_down


[gcode_macro BLTOUCH_TEST]
gcode:
    BLTOUCH_DEBUG COMMAND=touch_mode
    QUERY_PROBE


[gcode_macro SET_PRESSURE_ADVANCE]
rename_existing: SET_PRESSURE_ADVANCE_BASE
gcode:
    {% if 'EXTRUDER' in params %}
        SET_PRESSURE_ADVANCE_BASE {rawparams}
    {% else %}
        {% set active_ext = printer.toolhead.extruder %}
        SET_PRESSURE_ADVANCE_BASE EXTRUDER={active_ext} {rawparams}
    {% endif %}

