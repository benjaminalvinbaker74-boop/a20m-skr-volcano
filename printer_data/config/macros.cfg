# ====================================================================
# FILAMENT / COLOUR CHANGE (M600)                          >>> ADDED <<<
# ====================================================================
# PAUSE, RESUME and CANCEL_PRINT now live ONLY in mainsail.cfg - the
# custom overrides that used to be here were removed (see changelog at
# top of file) because they were stacking on top of mainsail's versions
# (double retract/park on every pause). Park position, retract lengths,
# idle-timeout-while-paused etc. are all configured in ONE place: the
# [gcode_macro _CLIENT_VARIABLE] block in printer.cfg. Change park
# position/retract there, not here.

# [gcode_macro M600]
# description: Manual filament/colour change.
# variable_pending_prime: 102.0        ; handoff length for _USER_RESUME_EXTRAS
# gcode:
#     PAUSE                            ; Park toolhead via mainsail.cfg
#     UNLOAD_FILAMENT                  ; Runs tip shaping + 102mm retraction
    
#     SET_GCODE_VARIABLE MACRO=M600 VARIABLE=pending_prime VALUE=102.0
#     M117 Swap filament, then press RESUME
#     RESPOND MSG="M600: Swap filament, then press RESUME"
[gcode_macro M600]
description: Manual filament/colour change.
variable_pending_prime: 0.0
gcode:
    PAUSE                            ; Park toolhead via mainsail.cfg
    UNLOAD_FILAMENT                  ; Runs ramming + tip-break + 102mm retract
    
    ; Hand off net distance (102mm retracted - 8mm rammed = 94mm net pull)
    SET_GCODE_VARIABLE MACRO=M600 VARIABLE=pending_prime VALUE=94.0
    
    M117 Swap filament, then press RESUME
    RESPOND MSG="M600: Swap filament, then press RESUME"

# [gcode_macro M600]
# description: Manual filament/colour change. Usage: just M600, no params needed.
# variable_change_retract: 102 # 78.0  ; extra filament pulled out on top of PAUSE's own small retract (see _CLIENT_VARIABLE.retract) - tune to your hotend/bowden length so the tip clears the extruder gears
# variable_change_retract_speed: 35.0  ; mm/s for that retract
# variable_pending_prime: 0            ; internal handoff to _USER_RESUME_EXTRAS - do not edit by hand
# gcode:
#     PAUSE
#     M83
# 									 ; Rapid tip break followed by clearance pull (Total = 90mm)
#     G1 E-20 F4200                    								; Rapid 20mm snap @ 70mm/s to form clean tip
#     G1 E-{change_retract-20} F{change_retract_speed * 60}         	; Pull remaining 70mm @ 40mm/s through drive gears
#     #G1 E-{change_retract} F{change_retract_speed * 60}
#     SET_GCODE_VARIABLE MACRO=M600 VARIABLE=pending_prime VALUE={change_retract}
#     M117 Swap filament, then press RESUME
#     RESPOND MSG="M600: swap filament now, then send RESUME"

[gcode_macro PARK_AND_SLEEP]
gcode:
    {% if printer.pause_resume.is_paused %}
        M117 Already paused. Sleeping heaters...
    {% else %}
        M117 Pausing print for sleep...
        PAUSE
    {% endif %}
    
    M104 S0
    M140 S0
    M106 S0
    M117 Printer asleep. Keep power ON!


[gcode_macro WAKE_AND_RESUME]
gcode:
    {% set target_extruder = printer.pause_resume.target_extruder|default(200)|float %}
    {% set target_bed = printer.pause_resume.target_bed|default(60)|float %}
    
    {% if printer.pause_resume.is_paused %}
        M117 Heating up for resume...
        M140 S{target_bed}
        M104 S{target_extruder}
        M190 S{target_bed}
        M109 S{target_extruder}
        M117 Resuming print...
        RESUME
    {% else %}
        M117 No active paused print to resume!
    {% endif %}


# ====================================================================
# MAINTENANCE & UTILITY MACROS
# ====================================================================

[gcode_macro CLEAN_NOZZLE]
description: Wipes nozzle back and forth across a predefined area
gcode:
    {% set wipe_count = 8 %}
    SAVE_GCODE_STATE NAME=clean_nozzle_state
    G90
    G0 Z15 F300
    {% for wipe in range(wipe_count) %}
        {% for coordinate in [200, 240] %}
            G0 X{coordinate} Y{4 + 0.25 * wipe} Z9.7 F12000
        {% endfor %}
    {% endfor %}
    RESTORE_GCODE_STATE NAME=clean_nozzle_state


[gcode_macro HEAT_SOAK]
description: Preheats bed for a heat soak (and hotend to standby). Usage: HEAT_SOAK TEMP=55
gcode:
    {% set TEMP = params.TEMP|default(55)|float %}
    {% set STANDBY = params.STANDBY|default(140)|float %}
    M140 S{TEMP}
    M104 S{STANDBY}
    RESPOND MSG="Heat soaking bed at {TEMP}C, hotend standby at {STANDBY}C"


[gcode_macro DISABLE_MOTORS]
description: Safely disables all stepper motors
gcode:
    M84 X Y Z E
    M117 Motors Disabled...


[gcode_macro FORCE_RAISE_Z]
description: Force-moves the Z stepper up 20mm
gcode:
    M400
    FORCE_MOVE STEPPER=stepper_z DISTANCE=20 VELOCITY=5


# ====================================================================
# FILAMENT UTILITIES
# ====================================================================

# [gcode_macro UNLOAD_FILAMENT]
# description: Shapes filament tip and unloads 102mm clear of BMG drive gears.
# gcode:
#     {% set unload_speed = params.SPEED|default(35)|float %}
#     {% set target_temp = params.TEMP|default(220)|float %}
    
#     ; Heat hotend if it isn't already warm enough
#     {% if printer.extruder.temperature < 180 %}
#         M117 Heating hotend for unload...
#         M109 S{target_temp}
#     {% endif %}

#     M83                              ; Relative extrusion
    
#     ; --- TIP SHAPING / RAMMING ---
#     G1 E18.0 F1500                    ; 18mm ramming stroke @ 25mm/s to clear Volcano reservoir
#     G4 P250                          ; 250ms thermal freeze dwell
    
#     ; --- FAST SNAP & CLEARANCE RETRACT (Total = 102mm) ---
#     G1 E-22.0 F4200                  ; Rapid 22mm snap @ 70mm/s to form clean spear tip
#     G1 E-80.0 F{unload_speed * 60}   ; Pull remaining 80mm @ 35mm/s through BMG drive gears
    
#     M117 Filament Unloaded!
#     RESPOND MSG="Filament unloaded cleanly."

[gcode_macro UNLOAD_FILAMENT]
description: Tip shapes, cools filament solid, and unloads clear of BMG drive gears.
gcode:
    {% set unload_speed = params.SPEED|default(20)|float %}  ; Slower clearance pull
    {% set target_temp = params.TEMP|default(220)|float %}
    
    ; Heat hotend if cold
    {% if printer.extruder.temperature < 180 %}
        M117 Heating hotend for unload...
        M109 S{target_temp}
    {% endif %}

    M83                              ; Relative extrusion
    
    ; --- 1. RAMMING / PRESSURE FLUSH ---
    G1 E8.0 F1500                    ; Flush liquid reservoir in Volcano block
    G4 P250                          ; Brief skin-freeze delay
    
    ; --- 2. SNAP RETRACT OUT OF HEATBREAK ---
    G1 E-22.0 F4200                  ; Snap 22mm @ 70mm/s into heatsink cold zone
    
    ; --- 3. CRITICAL SOLIDIFYING DWELL ---
    M117 Cooling filament tip...
    G4 P3000                         ; Hold in heatsink for 3 seconds so tip freezes solid
    
    ; --- 4. GENTLE CLEARANCE PULL THROUGH GEARS ---
    M117 Unloading through gears...
    G1 E-80.0 F{unload_speed * 60}   ; Pull remaining 80mm slowly (20mm/s) through BMG gears
    
    M117 Filament Unloaded!
    RESPOND MSG="Filament tip frozen solid and unloaded safely."

[gcode_macro LOAD_FILAMENT]
description: Loads filament 102mm back into hotend and primes melt zone.
gcode:
    {% set load_speed = params.SPEED|default(35)|float %}
    {% set target_temp = params.TEMP|default(220)|float %}
    
    {% if printer.extruder.temperature < 180 %}
        M117 Heating hotend for load...
        M109 S{target_temp}
    {% endif %}

    M83                              ; Relative extrusion
    G1 E80.0 F{load_speed * 60}      ; Fast feed through BMG drive gears
    G1 E22.0 F300                    ; Slow prime into Volcano melt zone @ 5mm/s
    
    M117 Filament Loaded!
    RESPOND MSG="Filament loaded."

# [gcode_macro LOAD_FILAMENT]
# gcode:
#     {% set TEMP = params.TEMP|default(240)|int %}
#     M109 S{TEMP}
#     G91
#     G1 E30 F2000
#     G1 E30 F200
#     G90
 
 
# [gcode_macro UNLOAD_FILAMENT]
# gcode:
#     {% set TEMP = params.TEMP|default(240)|int %}
#     M109 S{TEMP}
#     G91
#     G1 E5 F300
#     G1 E-120 F4000
#     G90
#     M104 S0
 
 
[gcode_macro DRY_FILAMENT]
description: Dries filament on the heated bed. Usage: DRY_FILAMENT TEMP=65 HOURS=4
gcode:
    {% set TARGET = params.TEMP|default(65)|int %}
    {% set HOURS = params.HOURS|default(4)|float %}
    {% set TOTAL_MINUTES = (HOURS * 60)|int %}
 
    # Cancel any pending auto-shutdown left over from a previous job
    UPDATE_DELAYED_GCODE ID=delayed_printer_off DURATION=0
 
    M104 S0   ; keep the hotend off, we only need the bed
 
    {% set current_bed = printer.heater_bed.temperature|float %}
 
    {% if TARGET > 85 and current_bed < TARGET %}
        # High target temps get ramped up in 5C steps, 5 minutes per
        # step, so the bed doesn't overshoot while it heat-soaks.
        RESPOND MSG="Target is above 85C - ramping up gradually..."
        {% set start_temp = [current_bed, 85]|max|int %}
        {% for t in range(start_temp, TARGET + 1, 5) %}
            M140 S{t}
            RESPOND MSG="Ramping bed to {t}C..."
            G4 P300000               ; hold 5 minutes at this step
            SET_IDLE_TIMEOUT TIMEOUT=1800
        {% endfor %}
    {% else %}
        M140 S{TARGET}
        RESPOND MSG="Heating bed to {TARGET}C..."
    {% endif %}
 
    # Wait for final target to actually be reached
    M190 S{TARGET}
    RESPOND MSG="Target reached. Drying for {HOURS} hour(s)..."
 
    # Hold at temperature, 1 minute per loop, resetting idle timeout
    # each time so Klipper doesn't shut the heaters off on its own.
    {% for i in range(TOTAL_MINUTES) %}
        G4 P60000                    ; hold 1 minute
        SET_IDLE_TIMEOUT TIMEOUT=1800
    {% endfor %}
 
    M140 S0
    RESPOND MSG="Drying complete. Powering down printer..."
    UPDATE_DELAYED_GCODE ID=delayed_printer_off DURATION=1
 


