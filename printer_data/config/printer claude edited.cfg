# ====================================================================
# MAIN PRINTER CONFIG
# ====================================================================

[gcode_arcs]
resolution: 1.0    ; some slicers require this to be set

# ====================================================================
# SKEW & TWIST COMPENSATION
# ====================================================================

[axis_twist_compensation]
speed: 50
#   The speed (in mm/s) of non-probing moves during the calibration.
#   The default is 50.
horizontal_move_z: 5
#   The height (in mm) that the head should be commanded to move to
#   just prior to starting a probe operation. The default is 5.
calibrate_start_x: 25
#   Minimum X coordinate of the calibration - positions the nozzle at
#   the starting calibration position.
calibrate_end_x: 230
#   Maximum X coordinate of the calibration - positions the nozzle at
#   the ending calibration position.
calibrate_y: 125
#   Y coordinate used during calibration - recommended to be near the
#   center of the bed.


# ====================================================================
# PRINTER & MCU CONFIGURATION
# ====================================================================

[mcu]
serial: /dev/ttyAMA0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 500        # was 100
max_accel: 8000          # was 3000
max_z_velocity: 20
max_z_accel: 500
minimum_cruise_ratio: 0.5      # disabled while testing
square_corner_velocity: 2.5    # stealth-mode default is 5, lowered for testing

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[display_status]
[pause_resume]
[exclude_object]
[endstop_phase]

[force_move]
enable_force_move: True

[respond]
default_type: echo

# ====================================================================
# INPUT SHAPING / RESONANCE
# ====================================================================

[resonance_tester]
accel_chip_x: lis2dw toolhead
accel_chip_y: lis2dw toolhead   # TODO: switch to the bed accelerometer once input shaper is reconfigured for it
probe_points:
    125, 125, 60       # Center of Geeetech A20 bed

[input_shaper]
shaper_type_x: 3hump_ei   # chosen after losing the heat block/tool board accelerometer - working with what's left
shaper_freq_x: 80.4
shaper_type_y: mzv        # second toolhead accelerometer is double-sided taped to the bed - working with what's left
shaper_freq_y: 36.2


# ====================================================================
# STEPPER MOTORS & DRIVERS
# ====================================================================

[stepper_x]
step_pin: P2.2
dir_pin: P2.6
enable_pin: !P2.1
microsteps: 16
rotation_distance: 39.69
endstop_pin: ^!P1.29
position_endstop: -17      # was -10
position_min: -17          # was -10
position_max: 260
homing_speed: 20

[tmc2209 stepper_x]
uart_pin: P1.10
run_current: 0.650
stealthchop_threshold: 0   # 0 = spreadcycle always on; 999999 = stealthchop, but caused layer shifts at high speed
interpolate: True
sense_resistor: 0.110

[stepper_y]
step_pin: P0.19
dir_pin: !P0.20
enable_pin: !P2.8
microsteps: 16
rotation_distance: 39.92
endstop_pin: ^!P1.28
position_endstop: -4       # was 0
position_min: -4
position_max: 260
homing_speed: 20

[tmc2209 stepper_y]
uart_pin: P1.9
run_current: 1.00   # raised from 0.650 -> 0.950 -> 1.00 to fix layer shifting
stealthchop_threshold: 0   # 0 = spreadcycle always on; 999999 = stealthchop, but caused layer shifts at high speed
interpolate: True
sense_resistor: 0.110

[stepper_z]
step_pin: P0.22
dir_pin: !P2.11
enable_pin: !P0.21
microsteps: 16
rotation_distance: 8
position_min: -25
position_max: 210
endstop_pin: probe:z_virtual_endstop
homing_speed: 5.0
homing_retract_dist: 5.0
homing_retract_speed: 5.0
second_homing_speed: 2.0

[tmc2209 stepper_z]
uart_pin: P1.8
run_current: 0.650
stealthchop_threshold: 0   # 0 = spreadcycle always on; 999999 = stealthchop, but caused layer shifts at high speed
interpolate: True
sense_resistor: 0.110

# ====================================================================
# EXTRUDER & HEATER BED
# ====================================================================

[extruder]
step_pin: EBB:PD3
dir_pin: !EBB:PD2
enable_pin: !EBB:PB6
microsteps: 16
rotation_distance: 21.740
gear_ratio: 50:17
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBB:PB0
sensor_type: ATC Semitec 104NT-4-R025H42G   # Trianglelab-style thermistor
smooth_time: 2.0   # increases temperature reading averaging (default is 1.0)
pullup_resistor: 2200
sensor_pin: EBB:PA1

control: pid
pid_kp: 25.133
pid_ki: 1.727
pid_kd: 91.417

min_temp: 0
max_temp: 280
max_extrude_cross_section: 5.0
max_extrude_only_velocity: 45
max_extrude_only_accel: 8000
pressure_advance: 0.038          # 0.05 was too aggressive for the volcano nozzle, caused gaps
pressure_advance_smooth_time: 0.04
max_extrude_only_distance: 200.0
min_extrude_temp: 0

[firmware_retraction]
retract_length: 0.3           ; Bowden reference: 2mm@20mm/s, 3mm@30mm/s, 4mm@40mm/s
retract_speed: 40             ; tuned safe, quiet speed
unretract_extra_length: 0.0   ; no extra push needed
unretract_speed: 40           ; matching prime speed

[tmc2209 extruder]
uart_pin: EBB:PB3
run_current: 0.45
stealthchop_threshold: 10
interpolate: True
sense_resistor: 0.110

[heater_bed]
heater_pin: P2.5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.25
control: pid
pid_kp: 72.830
pid_ki: 2.207
pid_kd: 600.844
min_temp: 0
max_temp: 130

# ====================================================================
# PROBING & BED LEVELING
# ====================================================================

[bltouch]
sensor_pin: ^!EBB:PA5
control_pin: EBB:PA4
pin_move_time: 0.680
x_offset: 40                       # pin is physically RIGHT of the nozzle; use -40 if LEFT
y_offset: 0
samples: 3
samples_result: median
samples_tolerance: 0.035           # tightened from 0.05 for better accuracy
samples_tolerance_retries: 3
sample_retract_dist: 2.5           # reduced from 5.0 to speed up probing
pin_up_reports_not_triggered: False
probe_with_touch_mode: False
speed: 5.0                         # increased from 3.0/3.5 for more consistent triggering
lift_speed: 5.0
stow_on_each_sample: False         # keeps pin deployed during sub-samples
pin_up_touch_mode_reports_triggered: True

[safe_z_home]
home_xy_position: 2,44
speed: 30
z_hop: 5
z_hop_speed: 4

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 35, 35
mesh_max: 225, 225
probe_count: 5, 5
mesh_pps: 2, 2
algorithm: bicubic
bicubic_tension: 0.2
move_check_distance: 5
split_delta_z: 0.05
fade_start: 1.0
fade_end: 10.0
fade_target: 0

[bed_screws]
screw1: 2,44
screw2: 170,44
screw3: 170,214
screw4: 2,214

[screws_tilt_adjust]
screw1: 2,44
screw1_name: front left screw
screw2: 170,44
screw2_name: front right screw
screw3: 170,214
screw3_name: rear right screw
screw4: 2,214
screw4_name: rear left screw
horizontal_move_z: 10.
speed: 50.
screw_thread: CW-M3

# ====================================================================
# PIN ALIASES
# ====================================================================

[board_pins]
aliases:
    EXP1_1=P1.30, EXP1_3=P1.18, EXP1_5=P1.20, EXP1_7=P1.22, EXP1_9=<GND>,
    EXP1_2=P0.28, EXP1_4=P1.19, EXP1_6=P1.21, EXP1_8=P1.23, EXP1_10=<5V>,
    EXP2_1=P0.17, EXP2_3=P3.26, EXP2_5=P3.25, EXP2_7=P1.31, EXP2_9=<GND>,
    EXP2_2=P0.15, EXP2_4=P0.16, EXP2_6=P0.18, EXP2_8=<RST>, EXP2_10=<NC>

# ====================================================================
# INCLUDES
# ====================================================================

[include mainsail.cfg]
[include KAMP_Settings.cfg]
[include bigtreetech-ebb42-gen2.cfg]
[include macros.cfg]

